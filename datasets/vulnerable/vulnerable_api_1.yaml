openapi: 3.0.0
info:
  title: Vulnerable User API
  version: 1.0.0
paths:
  /users:
    get:
      x-required-security-headers: [Strict-Transport-Security]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: {type: string}
                  password: {type: string}
  /users/{id}:
    delete:
      x-required-roles: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
      responses:
        "204": {description: Deleted}
